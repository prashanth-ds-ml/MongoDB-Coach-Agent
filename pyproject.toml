[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "certcoach"
version = "0.1.0"
description = "CertCoach CLI: AI Tutor for MongoDB Certification"
dependencies = [
    "pymongo>=4.0.0",
    "rich>=13.0.0",
    "langchain-ollama>=0.1.0",
    "python-dotenv>=1.0.0",
    "duckduckgo-search>=6.0.0"
]

[project.scripts]
certcoach = "certcoach.cli:main_menu"
certcoach-extract = "certcoach.core.image_extractor:process_pics_qa"
certcoach-seed-nightly = "certcoach.jobs.nightly_seed_questions:main"
certcoach-repair-explanations = "certcoach.jobs.repair_explanations:main"
certcoach-dedupe-questions = "certcoach.jobs.dedupe_questions:main"
certcoach-map-questions = "certcoach.jobs.map_questions:main"
certcoach-prebuild-lesson = "certcoach.jobs.prebuild_lessons:main"
certcoach-backfill-provenance = "certcoach.jobs.backfill_provenance:main"
certcoach-review-questions = "certcoach.jobs.review_questions:main"
certcoach-analyze-backlog = "certcoach.jobs.analyze_backlog:main"
certcoach-reocr-pics-qa = "certcoach.jobs.reocr_pics_qa:main"
certcoach-recover-screenshot-citations = "certcoach.jobs.recover_screenshot_citations:main"
certcoach-purge-screenshot-backlog = "certcoach.jobs.purge_screenshot_backlog:main"
certcoach-map-questions-to-docs = "certcoach.jobs.map_questions_to_docs:main"
certcoach-preview-concept = "certcoach.jobs.inspect_doc:main"
certcoach-generate-from-doc = "certcoach.jobs.generate_from_doc:main"
certcoach-flashcard-tools = "certcoach.jobs.flashcard_tools:main"
certcoach-ingest-authored = "certcoach.jobs.ingest_authored_content:main"
certcoach-notes = "certcoach.jobs.quick_notes:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
certcoach = ["data/*", "data/raw_markdowns/*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
